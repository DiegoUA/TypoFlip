<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
    <!-- Deep Charcoal Background (matching app) -->
    <rect width="1024" height="500" fill="#2D2D2D"/>

    <!-- Integrated Icon Graphic (shifted left) -->
    <rect x="100" y="100" width="300" height="300" rx="40" fill="#FFFFFF0F"/>
    <path d="M 360 160 L 360 260 C 360 310, 310 340, 260 340 L 160 340" stroke="#FF5722" stroke-width="25" fill="none" stroke-linecap="round"/>
    <polygon points="160,340 185,315 185,365" fill="#FF5722"/>
    <text x="180" y="280" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="180" fill="#FFFFFF">T</text>
    
    <!-- Title and Subtitle Text (shifted right) -->
    <text x="480" y="240" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="72" fill="#FFFFFF">TypoFlip</text>
    <text x="480" y="300" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#FFFFFFBF">Privacy-First Layout Utility</text>
</svg>
