name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git libffi-dev libssl-dev \
            python3-dev zip unzip zlib1g-dev libltdl-dev \
            autoconf libtool pkg-config cmake lld

      - name: Restore Keystore File
        run: |
          mkdir -p ~/.keystores
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ~/.keystores/typoflip-release.keystore

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install Buildozer & dependencies
        run: |
          python -m pip install --upgrade "pip<25.0" setuptools
          python -m pip install "cython<3.0.0" buildozer

      - name: Build Release APK with Buildozer
        env:
          ACCEPT_BUILD_END_USER_AGREEMENT: "1"
          P4A_RELEASE_KEYSTORE: /home/runner/.keystores/typoflip-release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
          
          APP_VERSION: "0.1.${{ github.run_number }}"
          APP_ANDROID_NUMERIC_VERSION: "${{ github.run_number }}"
        run: |
          buildozer -v android release

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TypoFlip-Release-APK
          path: bin/